name: PR Title Lint

# Reusable workflow — checks that a PR title matches the org [TYPE] commit
# convention (see CONTRIBUTING.md). Since PR titles become the squash-merge
# commit subject on `main`, this is a CI backstop for the local
# git-hooks/commit-msg hook, for contributors who haven't run the setup.
#
# Usage from another repo:
#
#   name: PR Title Lint
#   on:
#     pull_request:
#       types: [opened, edited, synchronize]
#   jobs:
#     lint:
#       uses: eye2gene/.github/.github/workflows/pr-title-lint.yml@main

on:
  workflow_call:

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$TITLE" | grep -qE '^\[(REQ|FIX|TEST|REFACTOR|SOUP|DOCS|BUILD|RELEASE)\] .+'; then
            echo "PR title must start with a valid [TYPE] prefix followed by a description."
            echo "Valid types: REQ, FIX, TEST, REFACTOR, SOUP, DOCS, BUILD, RELEASE"
            echo "Got: $TITLE"
            echo "See CONTRIBUTING.md for the full convention."
            exit 1
          fi
