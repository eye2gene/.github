name: PR Lint

# Reusable check: the PR title is a Conventional Commits subject (it becomes the
# commit on main when squashed) and the body links an issue (SOP-25 §5.6.2.10).
# Rules: CONTRIBUTING.md.
#
# Call it from a repo:
#
#   name: PR Lint
#   on:
#     pull_request:
#       types: [opened, edited, reopened, synchronize]
#   jobs:
#     lint:
#       uses: eye2gene/.github/.github/workflows/pr-lint.yml@main

on:
  workflow_call:

permissions: {}

jobs:
  pr-lint:
    # Bot PRs (Dependabot, release automation) are exempt; a code owner still reviews them.
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Check title and issue link
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}  # to ask GitHub to render the body; the call needs no permission
        run: |
          TYPES='feat|fix|test|refactor|perf|style|docs|build|ci|chore|revert'
          KEYS='close[sd]?|fix(e[sd])?|resolve[sd]?|refs?'
          status=0
          if printf '%s\n' "$TITLE" | grep -qE '^Revert ".+"$'; then
            KEYS="$KEYS|reverts?"  # GitHub's Revert button; its body links the reverted PR
          elif ! printf '%s\n' "$TITLE" | grep -qE "^($TYPES)(\([a-z0-9._/-]+\))?!?: [^[:space:]]"; then
            echo "::error title=PR title::Use '<type>[(<scope>)][!]: <subject>', e.g. 'fix(api): handle empty scan list'. Types: ${TYPES//|/ }. Got: $TITLE"
            status=1
          elif [ ${#TITLE} -gt 72 ]; then
            echo "::error title=PR title::Title is ${#TITLE} characters (max 72)."
            status=1
          elif printf '%s\n' "$TITLE" | grep -qE '\.$'; then
            echo "::error title=PR title::Remove the full stop at the end of the title."
            status=1
          fi
          # The issue link is a line that starts with the keyword and that GitHub shows as text. Each such
          # line gets a mark, GitHub renders the body, and a mark must be left outside comments and code.
          LINK="($KEYS):?[[:space:]]+(([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#[0-9]+|https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/issues/[0-9]+)([^[:alnum:]_/-]|$)"
          MARK=e2gIssueLinkLine
          MARKED=$(printf '%s\n' "$BODY" | tr -d '\r' | LINK="$LINK" MARK="$MARK" perl -pe 's/^([ \t]*)(?=$ENV{LINK})/$1$ENV{MARK} /i')
          SHOWN=""
          if printf '%s\n' "$MARKED" | grep -q "$MARK"; then
            if ! HTML=$(printf '%s\n' "$MARKED" | gh api markdown/raw -H 'Content-Type: text/plain' --input -); then
              echo "::error title=Issue link::GitHub did not render the PR body, so the issue link could not be checked. Run the job again."
              exit 1
            fi
            SHOWN=$(printf '%s\n' "$HTML" | perl -0pe 's/<pre\b.*?<\/pre>|<code\b.*?<\/code>//gs; s/<[^>]*>//g')
          fi
          if ! printf '%s\n' "$SHOWN" | grep -q "$MARK"; then
            echo "::error title=Issue link::Add a line 'Closes: #N' or 'Refs: #N' to the PR body. Every change on main traces to an issue (SOP-25 §5.6.2.10)."
            status=1
          fi
          exit $status
